[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildcoach"
version = "0.1.0"
description = "Check visible tag evidence for a three-step tabletop practice stand, and ask for another view when a tag is hidden."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.14.14",
]

[project.scripts]
buildcoach = "buildcoach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buildcoach = ["fixtures/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
